name: Daily Vanguard snapshot

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC, ~1h after tcgcsv daily update (~20:00 UTC)
  workflow_dispatch:        # manual "Run workflow" button for testing

permissions:
  contents: write           # needed to commit the new snapshot

concurrency:
  group: vanguard-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect snapshot
        run: python collect.py

      - name: Commit new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898978+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "snapshot $(date -u +%F)"
            git push
          fi
